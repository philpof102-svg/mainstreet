name: Publish npm + MCP registry

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # `npm test` runs three files; this step used to run one of them. The gate that decides whether
      # something reaches users was weaker than the gate a developer runs locally, which is the wrong way
      # round. No install step is needed: the suite is dependency-free (38 tests, ~220ms, measured).
      - name: Run tests
        run: npm test

      # The sibling repo shipped 0.1.0 under a tag announcing v0.2.0, because nothing compared the two.
      # A pushed tag cannot be re-pointed without rewriting public history, so that mistake cost a version
      # number. This refuses before publishing rather than after.
      - name: Refuse to publish when the tag and package.json disagree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=${TAG}  package.json=${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::the tag says ${TAG} and package.json says ${PKG}. Publishing here would put ${PKG} on npm under a tag announcing ${TAG}."
            exit 1
          fi

      # A manual run has no tag to compare against, so the step above cannot protect it. Saying so is the
      # point: mainstreet-oracle@0.9.2 reached npm this way, untagged, and the 0.9.3 release commit of
      # 2026-07-30 then sat unpublished for 14 days because no tag was ever pushed to trigger this workflow.
      - name: Say plainly that a manual run is unguarded
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "::warning::workflow_dispatch — no tag to compare against, so nothing here checks that package.json's version is the intended one."

      # NO `if:` HERE, deliberately: this one guards BOTH paths. The step above proves the tag and the
      # version agree; it says nothing about WHICH PACKAGE gets published, and that is the hole measured on
      # 2026-08-13. Five branches of this repo still declare @raskhaaa/mainstreet-oracle -- the scope
      # abandoned by the rename -- and none of them carries any guard at all. A tag pushed onto one of them
      # would publish the dead package, and the version check would PASS, because 0.9.2 there does match a
      # tag saying v0.9.2. npm already serves @raskhaaa/mainstreet-oracle@0.9.0, which is exactly the
      # version add-smithery-config declares. The dispatch path needs this just as much: an untagged manual
      # run is how mainstreet-oracle@0.9.2 reached npm in the first place.
      #
      # If the package is ever renamed on purpose, this fails loudly and the new name is written here. That
      # is the intended behaviour -- a release guard is the one place a rename must be restated by hand.
      - name: Refuse to publish anything but the canonical package
        run: |
          CANON="mainstreet-oracle"
          NAME=$(node -p "require('./package.json').name")
          echo "package name=${NAME}  canonical=${CANON}"
          if [ "${NAME}" != "${CANON}" ]; then
            echo "::error::this ref declares ${NAME}, not ${CANON}. Publishing would resurrect an abandoned package name from a stale branch."
            exit 1
          fi

      # ⛔ L'ETAT D'AVANT, CAPTURE AVANT D'AGIR — et il gouverne DEUX choses: si npm doit tourner, et
      # ce que la verification plus bas a le droit d'affirmer.
      #
      # Mesure du 2026-08-17, en comparant les trois depots freres: celui-ci etait le seul sans ce
      # controle. Consequence, deja payee dans `biii` le 2026-07-27: quand `npm publish` echoue — une
      # version deja publiee, un jeton absent — le job MEURT, et les trois etapes suivantes passent en
      # « skipped ». Or la publication au registre MCP s'authentifie en OIDC et n'a AUCUN besoin de
      # npm: elle aurait pu aboutir. Dans le journal, un saut ressemble a une decision, pas a un
      # blocage — c'est ce qui rend ce mode d'echec cher.
      - name: npm — cette version est-elle deja publiee ?
        id: npmstate
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if npm view "mainstreet-oracle@$V" version >/dev/null 2>&1; then
            echo "deja publie sur npm: mainstreet-oracle@$V — l'etape publish sera sautee, le registre MCP tournera quand meme"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "absent de npm: mainstreet-oracle@$V — l'etape publish tournera"
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Pas de `continue-on-error`: la condition remplace l'avalage. Quand npm DOIT tourner et
      # echoue, la release ne doit pas aboutir — sinon le registre annoncerait une version que npm ne
      # sert pas. Quand npm n'a rien a faire, l'etape est sautee et le registre continue.
      - name: npm publish
        if: ${{ inputs.dry_run != 'true' && steps.npmstate.outputs.already != 'true' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ⚠️ UNE GARDE QUI VERIFIE UN ETAT NE PROUVE PAS UN CHANGEMENT D'ETAT, et c'est pour ca qu'elle
      # a DEUX branches. Un simple `npm view <pkg>@<v>` apres coup rend « present » aussi bien pour
      # « on vient de la publier » que pour « elle existe depuis un mois » — mesure du 2026-08-17 sur
      # le workflow voisin de `lawbor`, ou cette confusion faisait sortir un run VERT en n'ayant rien
      # expedie. L'etat d'AVANT est donc ce qui autorise l'affirmation.
      #
      # La boucle de reessai n'est pas du zele: le registre npm propage avec du retard, et une lecture
      # immediate a deja rendu 404 sur une version reellement publiee.
      #
      # La valeur passe par `env:`, jamais interpolee DANS le `run:`: une expression est substituee
      # AVANT que bash ne voie la ligne.
      - name: Verifier que npm sert VRAIMENT cette version
        if: ${{ inputs.dry_run != 'true' }}
        env:
          DEJA_PUBLIE: ${{ steps.npmstate.outputs.already }}
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$DEJA_PUBLIE" = "true" ]; then
            echo "::notice::mainstreet-oracle@$V etait DEJA sur npm avant ce run — RIEN n'a ete publie."
            echo "Ce run rafraichit le registre MCP uniquement. Pour expedier du code aux"
            echo "installateurs, monter la version dans package.json (voir npm run test:published)."
            exit 0
          fi
          for i in $(seq 1 12); do
            GOT=$(npm view mainstreet-oracle@"$V" version 2>/dev/null || true)
            if [ "$GOT" = "$V" ]; then echo "npm sert mainstreet-oracle@$V (publie par ce run)"; exit 0; fi
            echo "npm ne sert pas encore $V (essai $i/12) — attente 10s"; sleep 10
          done
          echo "::error::mainstreet-oracle@$V n'est jamais apparu sur npm — la publication a echoue. Le secret NPM_TOKEN est-il pose et valide ?"; exit 1

      - name: Install mcp-publisher
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: MCP login (GitHub OIDC)
        if: ${{ inputs.dry_run != 'true' }}
        run: ./mcp-publisher login github-oidc

      - name: MCP publish
        if: ${{ inputs.dry_run != 'true' }}
        run: ./mcp-publisher publish
