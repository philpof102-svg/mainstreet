name: Publish npm + MCP registry

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # `npm test` runs three files; this step used to run one of them. The gate that decides whether
      # something reaches users was weaker than the gate a developer runs locally, which is the wrong way
      # round. No install step is needed: the suite is dependency-free (38 tests, ~220ms, measured).
      - name: Run tests
        run: npm test

      # The sibling repo shipped 0.1.0 under a tag announcing v0.2.0, because nothing compared the two.
      # A pushed tag cannot be re-pointed without rewriting public history, so that mistake cost a version
      # number. This refuses before publishing rather than after.
      - name: Refuse to publish when the tag and package.json disagree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=${TAG}  package.json=${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::the tag says ${TAG} and package.json says ${PKG}. Publishing here would put ${PKG} on npm under a tag announcing ${TAG}."
            exit 1
          fi

      # A manual run has no tag to compare against, so the step above cannot protect it. Saying so is the
      # point: mainstreet-oracle@0.9.2 reached npm this way, untagged, and the 0.9.3 release commit of
      # 2026-07-30 then sat unpublished for 14 days because no tag was ever pushed to trigger this workflow.
      - name: Say plainly that a manual run is unguarded
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "::warning::workflow_dispatch — no tag to compare against, so nothing here checks that package.json's version is the intended one."

      # NO `if:` HERE, deliberately: this one guards BOTH paths. The step above proves the tag and the
      # version agree; it says nothing about WHICH PACKAGE gets published, and that is the hole measured on
      # 2026-08-13. Five branches of this repo still declare @raskhaaa/mainstreet-oracle -- the scope
      # abandoned by the rename -- and none of them carries any guard at all. A tag pushed onto one of them
      # would publish the dead package, and the version check would PASS, because 0.9.2 there does match a
      # tag saying v0.9.2. npm already serves @raskhaaa/mainstreet-oracle@0.9.0, which is exactly the
      # version add-smithery-config declares. The dispatch path needs this just as much: an untagged manual
      # run is how mainstreet-oracle@0.9.2 reached npm in the first place.
      #
      # If the package is ever renamed on purpose, this fails loudly and the new name is written here. That
      # is the intended behaviour -- a release guard is the one place a rename must be restated by hand.
      - name: Refuse to publish anything but the canonical package
        run: |
          CANON="mainstreet-oracle"
          NAME=$(node -p "require('./package.json').name")
          echo "package name=${NAME}  canonical=${CANON}"
          if [ "${NAME}" != "${CANON}" ]; then
            echo "::error::this ref declares ${NAME}, not ${CANON}. Publishing would resurrect an abandoned package name from a stale branch."
            exit 1
          fi

      - name: npm publish
        if: ${{ inputs.dry_run != 'true' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: MCP login (GitHub OIDC)
        if: ${{ inputs.dry_run != 'true' }}
        run: ./mcp-publisher login github-oidc

      - name: MCP publish
        if: ${{ inputs.dry_run != 'true' }}
        run: ./mcp-publisher publish
